name: Update flood risk

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy shapely xarray netCDF4 h5netcdf harmony-py pdfplumber imdlib
      - run: python scripts/update.py
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      - name: Save the new data
        run: |
          git config user.name "flood-watch-bot"
          git config user.email "flood-watch-bot@users.noreply.github.com"
          git add docs/data/risk.json docs/data/history
          git diff --cached --quiet || git commit -m "Update flood risk"
          git pull --rebase -X theirs origin main || true
          git push
