<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamil Nadu Flood Watch</title>
<meta name="description" content="District-by-district flood risk for Tamil Nadu for the next three days, and a guide to floods, their impact and how to stay safe. In English and Tamil. Not an official warning.">
<style>
  :root {
    --ink: #17212b; --ink-2: #4a5866; --line: #dfe4e8; --paper: #f7f8f6; --card: #ffffff;
    --accent: #0f5c78; --deep: #0c3a4d;
    --low: #cfe3d4; --watch: #f3d35b; --warning: #ee8a2f; --danger: #c9302c; --nodata: #e6e6e6;
    --radius: 10px;
  }
  * { box-sizing: border-box; min-width: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 70px; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Tamil", "Latha", sans-serif;
         color: var(--ink); background: var(--paper); line-height: 1.6; font-size: 16px; overflow-x: clip; }
  body.ta { line-height: 1.75; }
  a { color: var(--accent); }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

  header.top { background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 5; }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
  .brand svg { width: 22px; height: 22px; flex: none; }
  nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  nav.tabs a { color: #cfdbe4; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: .95rem; min-height: 40px; display: inline-flex; align-items: center; }
  nav.tabs a:hover { color: #fff; background: rgba(255,255,255,.08); }
  nav.tabs a.on { color: #fff; background: rgba(255,255,255,.16); font-weight: 600; }
  .langbtn { all: unset; cursor: pointer; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: .92rem; margin-left: 6px; min-height: 30px; }
  .langbtn:focus-visible, nav.tabs a:focus-visible { outline: 2px solid #8fd0ea; outline-offset: 2px; }

  .notice { background: #fff4d6; border-bottom: 1px solid #f0dea6; font-size: .92rem; }
  .notice .wrap { padding-top: 9px; padding-bottom: 9px; }
  .notice strong { color: #7a5200; }

  .view { display: none; }
  .view.on { display: block; }
  .hero { padding: 26px 0 8px; }
  .hero h1, .view > .wrap > h1 { font-size: clamp(1.55rem, 3.2vw, 2.25rem); line-height: 1.18; margin: 0 0 8px; max-width: 820px; text-wrap: balance; }
  .hero p, .lead { margin: 0; color: var(--ink-2); max-width: 760px; }
  .status { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 4px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: .9rem; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,.12); }
  .demo { background: #ffe1df; border-color: #f2b1ab; color: #7d1f19; font-weight: 600; }

  .main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; margin: 16px 0 32px; }
  @media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .mapcard { padding: 10px; }
  #map { width: 100%; height: auto; display: block; }
  #map path { stroke: #fff; stroke-width: .9; cursor: pointer; }
  #map path:hover { opacity: .8; }
  #map path.sel { stroke: var(--ink); stroke-width: 2.2; }
  #map text { font-size: 9px; fill: #253340; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 2.5px; }
  body.ta #map text { font-size: 7.5px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 8px 2px; font-size: .88rem; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .panel { padding: 18px 20px; }
  .panel h2 { margin: 0 0 4px; font-size: 1.3rem; }
  .lvl { display: inline-block; padding: 3px 10px; border-radius: 6px; font-weight: 700; font-size: .88rem; white-space: nowrap; }
  .lvl.l0 { background: var(--low); } .lvl.l1 { background: var(--watch); }
  .lvl.l2 { background: var(--warning); color: #fff; } .lvl.l3 { background: var(--danger); color: #fff; }
  .lvl.ln { background: var(--nodata); }
  .reason { margin: 10px 0 14px; color: var(--ink-2); }
  .reason li { margin-bottom: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: .93rem; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; font-size: .84rem; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .list { max-height: 440px; overflow: auto; }
  .list button { all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 9px 4px; border-bottom: 1px solid var(--line); min-height: 26px; }
  .list button:hover, .list button:focus-visible { background: #f3f6f8; }
  .muted { color: var(--ink-2); font-size: .9rem; }
  .back { all: unset; cursor: pointer; color: var(--accent); font-size: .92rem; margin-bottom: 8px; display: inline-block; }
  .sigs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .sig { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; color: var(--ink-2); }
  .sig .lvl { font-size: .76rem; padding: 2px 7px; }

  .pagehead { padding: 28px 0 6px; }
  section.block { padding: 30px 0; border-top: 1px solid var(--line); }
  section.block:first-of-type { border-top: 0; }
  section.block h2 { font-size: 1.45rem; margin: 0 0 6px; text-wrap: balance; }
  section.block .lead { margin: 0 0 18px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
  @media (max-width: 900px) { .grid4, .grid3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 560px) { .grid4, .grid3, .grid2 { grid-template-columns: 1fr; } }
  .step { padding: 16px 18px; }
  .step .n { font-size: .82rem; font-weight: 700; color: var(--accent); }
  .step h3 { margin: 4px 0 6px; font-size: 1.05rem; }
  .step p { margin: 0; color: var(--ink-2); font-size: .94rem; }
  .step ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: .94rem; }
  .step li { margin-bottom: 7px; }
  .stat { padding: 16px 18px; }
  .stat .big { font-size: clamp(1.6rem, 3vw, 2.1rem); font-weight: 750; line-height: 1.1; color: var(--deep); }
  .stat .lab { color: var(--ink-2); font-size: .92rem; margin-top: 4px; }
  .hit { color: #1d7a3a; font-weight: 600; } .miss { color: var(--danger); font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  .band { background: var(--deep); color: #eaf4f8; border-radius: var(--radius); padding: 22px; }
  .band h3 { margin: 0 0 4px; color: #fff; }
  .band a { color: #9fd6ee; }
  @media (max-width: 700px) { header.top { position: static; } nav.tabs { flex-wrap: nowrap; overflow-x: auto; width: 100%; } nav.tabs a { white-space: nowrap; flex: none; } .langbtn { flex: none; } }
  .band p { margin: 0 0 12px; color: #cfe3ec; }
  .depth { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; align-items: end; }
  @media (max-width: 560px) { .depth { grid-template-columns: 1fr; } }
  .depth figure { margin: 0; text-align: center; }
  .depth svg { width: 100%; max-width: 210px; height: auto; }
  .depth figcaption { font-size: .93rem; color: #eaf4f8; }
  .depth figcaption b { display: block; font-size: 1.35rem; color: #fff; }
  .timeline { list-style: none; margin: 0; padding: 0; border-left: 3px solid var(--line); }
  .timeline li { position: relative; padding: 0 0 16px 18px; }
  .timeline li::before { content: ""; position: absolute; left: -8px; top: 6px; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); }
  .timeline .yr { font-weight: 700; }
  .sources { font-size: .86rem; color: var(--ink-2); }
  .sources li { margin-bottom: 4px; overflow-wrap: anywhere; }
  footer { background: #eef1f0; border-top: 1px solid var(--line); padding: 24px 0 40px; font-size: .9rem; color: var(--ink-2); margin-top: 20px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C9 7 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-4-8-7-13z" fill="#5fb3d4"/></svg>
      <span data-i="title">Tamil Nadu Flood Watch</span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#map" data-tab="map" data-i="nav_map">Live map</a>
      <a href="#learn" data-tab="learn" data-i="nav_learn">Learn about floods</a>
      <a href="#how" data-tab="how" data-i="nav_how">How it works</a>
      <a href="#record" data-tab="record" data-i="nav_record">Track record</a>
      <a href="#about" data-tab="about" data-i="nav_about">About</a>
      <button class="langbtn" id="langbtn" type="button" aria-label="Switch language">தமிழ்</button>
    </nav>
  </div>
</header>

<div class="notice"><div class="wrap" data-i="notice" data-html></div></div>

<!-- ============ LIVE MAP ============ -->
<main class="view wrap" id="v-map">
  <div class="hero">
    <h1 data-i="hero_h1">Flood risk for every district in Tamil Nadu, for the next three days</h1>
    <p data-i="hero_p"></p>
    <div class="status" id="status"></div>
  </div>
  <div class="main">
    <div class="card mapcard">
      <svg id="map" role="img" aria-label="Map of Tamil Nadu districts coloured by flood risk"></svg>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card panel" id="panel"></div>
  </div>
</main>

<!-- ============ LEARN ============ -->
<div class="view" id="v-learn"><div class="wrap" id="learn-body"></div></div>

<!-- ============ HOW IT WORKS ============ -->
<div class="view" id="v-how">
  <div class="wrap">
    <section class="block">
      <h1 data-i="how_h">How it works</h1>
      <p class="lead" data-i="how_lead"></p>
      <div class="grid4" id="how-steps"></div>
    </section>
    <section class="block">
      <h2 data-i="levels_h">What the levels mean</h2>
      <div class="tablewrap card" style="padding:4px 10px"><table id="levels-table"><thead></thead><tbody></tbody></table></div>
      <p class="muted" id="thr-note" style="margin-top:8px"></p>
    </section>
  </div>
</div>

<!-- ============ TRACK RECORD ============ -->
<div class="view" id="v-record">
  <div class="wrap">
    <section class="block">
      <h1 data-i="rec_h">Track record</h1>
      <p class="lead" data-i="rec_lead"></p>
      <div id="record-body"></div>
    </section>
    <section class="block">
      <h2 data-i="fct_h">Test with the forecasts that were really issued</h2>
      <p class="lead" data-i="fct_lead"></p>
      <div id="fct-body"></div>
    </section>
  </div>
</div>

<!-- ============ ABOUT ============ -->
<div class="view" id="v-about">
  <div class="wrap">
    <section class="block">
      <h1 data-i="about_h">About and limitations</h1>
      <div class="grid3" id="about-cards"></div>
      <p class="muted" style="margin-top:18px" data-i="about_by"></p>
    </section>
  </div>
</div>

<footer><div class="wrap" data-i="footer" data-html></div></footer>

<script>
{
// ---------------------------------------------------------------- text in both languages
const T = {
en: {
  title: "Tamil Nadu Flood Watch", nav_map: "Live map", nav_learn: "Learn about floods", nav_how: "How it works",
  nav_record: "Track record", nav_about: "About", other_lang: "தமிழ்",
  notice: `<strong>Not an official warning.</strong> For official alerts follow <a href="https://tnsdma.tn.gov.in/" target="_blank" rel="noopener">TNSDMA</a>, <a href="https://mausam.imd.gov.in/chennai/" target="_blank" rel="noopener">IMD Chennai</a>, <a href="https://ffs.india-water.gov.in/" target="_blank" rel="noopener">CWC</a> and your District Collector. Disaster helpline: 1070 (state), 1077 (district); emergencies: 112.`,
  hero_h1: "Flood risk for every district in Tamil Nadu, for the next three days",
  hero_p: "Built only from open data: rainfall forecasts, NASA satellite rainfall, the state's rain gauges, river-flow forecasts and reservoir levels, each checked against the district's own history. Updated every three hours.",
  levels: ["Low", "Watch", "Warning", "Danger"], nodata: "No data",
  meaning: ["Nothing unusual expected.", "Heavy rain likely. Stay updated and avoid low-lying roads.",
            "Very heavy rain or high river flow likely. Flooding possible; prepare and follow official advice.",
            "Extreme rain or river flow likely. Serious flooding possible; act on official warnings immediately."],
  sig: {forecast: "Forecast", satellite: "Satellite", imd: "IMD gauge grid", gauge: "Rain gauges", reservoir: "Reservoirs", river: "River flow"},
  updated: "Updated", ist: "IST", no_above_low: "No district above Low", delayed: "Delayed", demo: "Example data for preview, not a real forecast",
  waiting_h: "Waiting for data", waiting_p: "The first live update hasn't run yet.",
  flagged: n => n ? `${n} district${n > 1 ? "s" : ""} flagged` : "No districts flagged",
  click_hint: "Click a district on the map or below for details.", all_districts: "All districts",
  nothing: "No signal above its threshold.",
  day: "Day", rain_day: "Rain that day", three_day: "3-day total", level: "Level", rivers: "Rivers",
  peak7: "m³/s peak (7 days)",
  gauge_line: (d, a, m) => `Rain gauges (24 h to 8:30 am ${d}): district average ${a ?? "–"} mm${m ? ", heaviest gauge " + m + " mm" : ""}.`,

  when: L => L === 0 ? "today" : L === 1 ? "tomorrow" : `in ${L} days`,

  },
  how_h: "How it works",
  how_lead: "Floods in Tamil Nadu usually follow very heavy rain over one to three days, often from a cyclone or depression during the north-east monsoon. The site watches for exactly that, district by district.",
  how: [["Step 1", "Rain: forecast and observed", "Every three hours: the rain forecast for the next three days, NASA satellite rain for the wettest spot in each district, IMD's gauge-based rain, and the heaviest reading from Tamil Nadu's ~590 rain gauges."],

  rec_stats: s => [[`${s.test.hits}/${s.test.pairs}`, `district floods flagged at Warning or above in the test period (${s.test.first_year}–${s.test.last_year})`],

  rec_cols: ["Flood", "Dates", "Set", "Districts flagged", "Districts missed", "Caught by"], test: "Test", training: "Training",
  rec_signal: s => `Each signal on its own, test years: ${s}.`,

},
ta: {

      <li>Drink only boiled or chlorinated water ${L_("imddos", 17)}.</li>
      <li>Throw away any food that touched flood water ${L_("health", 10)}.</li>
      <li>See a doctor if you get a fever after walking in flood water; it could be leptospirosis.</li>
      <li>Clean and disinfect everything that got wet.</li>
      <li>Have electrics checked before switching on.</li>
      <li>Empty stagnant water around your home to stop mosquitoes.</li></ul></div>
  </div>
</section>

<section class="block">
  <h2>What we can do together</h2>
  <div class="grid3">
    <div class="card step"><h3>Protect lakes and tanks</h3><p>They are the state's natural flood defences. Report encroachments to your local body and join lake clean-ups.</p></div>
    <div class="card step"><h3>Keep water moving</h3><p>Keep drains free of plastic and rubbish, and ask your ward to clear storm-water drains before October.</p></div>
    <div class="card step"><h3>Let rain soak in</h3><p>Rainwater harvesting, trees, and open soil instead of concrete reduce the water that rushes into streets.</p></div>
    <div class="card step"><h3>Look out for each other</h3><p>Check on elderly neighbours and families in low-lying homes. Share official warnings, not rumours.</p></div>
    <div class="card step"><h3>Be ready as a street</h3><p>Know who has a first-floor room, a boat, or medical skills. Agree where everyone will meet.</p></div>
    <div class="card step"><h3>Spread the word</h3><p>Share this page in Tamil or English with family, school and neighbours before the monsoon.</p></div>
  </div>
</section>

  <h2>Tamil Nadu's recent floods</h2>

</section>

<section class="block pagehead">
  <h1>தமிழ்நாட்டில் வெள்ளம்: ஏன் ஏற்படுகிறது, என்ன பாதிப்பு, எப்படிப் பாதுகாப்பாக இருப்பது</h1>
  <p class="lead">சென்னையின் தெருக்கள் முதல் காவிரி டெல்டா, தென் மாவட்டங்கள் வரை தமிழ்நாடு ஏறக்குறைய ஒவ்வொரு ஆண்டும் வெள்ளத்தைச் சந்திக்கிறது. காரணங்களை அறிவது தயாராக உதவுகிறது; என்ன செய்ய வேண்டும் என்பதை அறிவது உயிர்களைக் காப்பாற்றும்.</p>
</section>

<section class="block">
  <div class="grid4">
    <div class="card stat"><div class="big">500+</div><div class="lab">2015 வெள்ளத்தில் உயிரிழந்தவர்கள்; 18 லட்சத்திற்கும் மேற்பட்டோர் இடம்பெயர்ந்தனர் ${L_("dte15", 1)}</div></div>
    <div class="card stat"><div class="big">44 செ.மீ</div><div class="lab">நவம்பர் 2022-இல் சீர்காழியில் 24 மணி நேரத்தில் பெய்த மழை ${L_("imd22", 2)}</div></div>
    <div class="card stat"><div class="big">93 செ.மீ</div><div class="lab">டிசம்பர் 2023-இல் காயல்பட்டினத்தில் (தூத்துக்குடி) 24 மணி நேரத்தில்; அதன் வழக்கமான ஓராண்டு மழையை விட அதிகம் ${L_("dh23", 3)}</div></div>
    <div class="card stat"><div class="big">₹50,000 கோடி+</div><div class="lab">2015 சென்னை வெள்ளத்தால் ஏற்பட்ட இழப்பும் சேதமும் (மதிப்பீடு) ${L_("niti", 4)}</div></div>
  </div>
</section>

<section class="block">
  <h2>தமிழ்நாட்டில் வெள்ளம் ஏன் ஏற்படுகிறது</h2>
  <div class="grid2">
    <div class="card step"><h3>வடகிழக்குப் பருவமழையும் புயல்களும்</h3><p>வங்கக் கடலில் காற்றழுத்தத் தாழ்வுகளும் புயல்களும் உருவாகி கடற்கரையை நோக்கி நகரும் அக்டோபர் முதல் டிசம்பர் வரையிலான காலத்தில்தான் தமிழ்நாட்டின் மிகக் கனமழையின் பெரும்பகுதி பெய்கிறது. ஒரு அமைப்பு ஓரிடத்தில் நின்றுவிட்டால், ஓரிரு நாட்களில் மிகப் பெரிய அளவு மழை கொட்டலாம்: நவம்பர் 2022-இல் சீர்காழியில் பெய்த 44 செ.மீ மழை, 122 ஆண்டுகளில் அதிகபட்சம் ${L_("imd22", 2)}.</p></div>
    <div class="card step"><h3>காணாமல் போன ஏரிகளும் அடைபட்ட கால்வாய்களும்</h3><p>குளங்கள், ஏரிகள், ஆறுகள் ஒரு காலத்தில் இந்த நீரைச் சேமித்து வெளியேற்றின. அவற்றில் பல ஆக்கிரமிக்கப்பட்டு கட்டடங்களாகிவிட்டன. சென்னையின் 19 முக்கிய ஏரிகளின் பரப்பு 1,130 ஹெக்டேரிலிருந்து சுமார் 645 ஹெக்டேராகச் சுருங்கியது ${L_("print23", 5)}. குளங்கள், ஏரிகள், ஆற்றுப் படுகைகளின் ஆக்கிரமிப்பு 2015 வெள்ளத்தில் பெரும் பங்கு வகித்தது என இந்தியத் தலைமைக் கணக்குத் தணிக்கையாளர் (CAG) கண்டறிந்தார் ${L_("cag", 6)}.</p></div>
    <div class="card step"><h3>தொலைவிலிருந்து வரும் நீர்</h3><p>சில வெள்ளங்கள் மாநிலத்திற்கு வெளியே தொடங்குகின்றன. ஆகஸ்ட் 2018-இல் கர்நாடகா, கேரளாவில் பெய்த கனமழையால் கபினி, KRS அணைகளிலிருந்து பெருமளவு நீர் திறக்கப்பட்டது; அந்த நீர் மேட்டூரை அடைய சுமார் இரண்டு நாட்கள் ஆகும் ${L_("scroll18", 7)}. பின்னர் காவிரி கீழ்ப்பகுதி கிராமங்களில் வெள்ளம் ஏற்படுத்தியது. கேரள மலைகளில் பெய்யும் மழையும் தேனி மாவட்ட ஆறுகளின் நீர்மட்டத்தை உயர்த்தலாம்.</p></div>
    <div class="card step"><h3>வெப்பமடையும் காலநிலை</h3><p>வெப்பமான வளிமண்டலம் அதிக ஈரப்பதத்தைத் தாங்கும்; எனவே பல இடங்களில் மிகக் கனமான மழைப்பொழிவுகள் மேலும் தீவிரமடையும் என விஞ்ஞானிகள் எதிர்பார்க்கின்றனர். அதிக கான்கிரீட்டும் குறைந்த ஏரிகளும் சேரும்போது, குறுகிய நேர அதீத மழையே வெள்ளத்தை ஏற்படுத்த வாய்ப்பு அதிகம்.</p></div>
  </div>
</section>

<section class="block">
  <h2>வெள்ளம் மக்களுக்கு ஏற்படுத்தும் பாதிப்புகள்</h2>
  <div class="grid2">
    <div class="card step"><h3>உயிர்களும் வீடுகளும்</h3><p>2015 வெள்ளத்தில் 500-க்கும் மேற்பட்டோர் உயிரிழந்தனர்; 18 லட்சத்திற்கும் மேற்பட்டோர் இடம்பெயர்ந்தனர் ${L_("dte15", 1)}. சென்னையில் குறைந்தது 57,000 வீடுகள் சேதமடைந்தன; அவற்றில் பெரும்பாலானவை உழைக்கும் குடும்பங்களுடையவை ${L_("wiki15", 8)}. டிசம்பர் 2023-இல் நான்கு தென் மாவட்டங்களில் 31 உயிர்கள் பறிபோயின ${L_("deaths23", 9)}.</p></div>
    <div class="card step"><h3>உடல்நலம்</h3><p>நீர் வடிந்த பிறகு நோய்கள் பரவுவது வழக்கம்: மாசடைந்த நீரால் வயிற்றுப்போக்கு, காலரா, டைபாய்டு, மஞ்சள் காமாலை (ஹெபடைடிஸ் A), எலிக்காய்ச்சல் (லெப்டோஸ்பைரோசிஸ்); தேங்கிய நீரில் பெருகும் கொசுக்களால் டெங்கு, மலேரியா ${L_("health", 10)}.</p></div>
    <div class="card step"><h3>விவசாயமும் வாழ்வாதாரமும்</h3><p>நவம்பர் 2022 மழையால் மயிலாடுதுறையில் 34,582 ஹெக்டேர் பயிர்கள் பாதிக்கப்பட்டன ${L_("sirkazhi", 11)}. டிசம்பர் 2023 வெள்ளத்தில் நூற்றுக்கணக்கான ஆடுகளும் மாடுகளும் 29,500 கோழிகளும் இறந்தன ${L_("livestock", 12)}. ஆற்றங்கரைகளில் வசிக்கும் தினக்கூலித் தொழிலாளர்களே பெரும்பாலும் அதிகம் பாதிக்கப்படுகின்றனர் ${L_("scrollbank", 13)}.</p></div>
    <div class="card step"><h3>முழுப் பொருளாதாரம்</h3><p>2015 சென்னை வெள்ளத்தால் ₹50,000 கோடி முதல் ₹1 லட்சம் கோடி வரை இழப்பும் சேதமும் ஏற்பட்டதாக நிதி ஆயோக் மதிப்பிட்டது ${L_("niti", 4)}. 2024-இல் ஃபெஞ்சல் புயல் 14 மாவட்டங்களில் சாலைகளையும் மின்கம்பிகளையும் சேதப்படுத்திப் பேரழிவை ஏற்படுத்தியது ${L_("fengal", 14)}.</p></div>
  </div>
</section>

<section class="block">
  <div class="band">
    <h3>வெள்ள நீரில் ஒருபோதும் நடக்கவோ வாகனம் ஓட்டவோ வேண்டாம்</h3>
    <p>ஓடும் நீர் தோன்றுவதை விடப் பல மடங்கு வலிமையானது; அதன் அடியில் உள்ள திறந்த வடிகால்கள், பாதாளச் சாக்கடை மூடிகள், உடைந்த சாலைகள் கண்ணுக்குத் தெரியாது.</p>
    <div class="depth">
      ${depthFig(22, "15 செ.மீ", "வேகமாக ஓடும் நீர் ஒரு பெரியவரையே கீழே தள்ளிவிடும்", false)}
      ${depthFig(40, "30 செ.மீ", "நீரில் ஒரு காரோ சிறிய SUV-யோ மிதக்கத் தொடங்கும்", true)}
      ${depthFig(60, "45–60 செ.மீ", "பாய்ந்தோடும் நீர் பெரிய வாகனங்களையும் அடித்துச் செல்லும்", true)}
    </div>
    <p style="margin:12px 0 0;font-size:.85rem">ஆதாரம்: அமெரிக்க தேசிய வானிலை சேவை ${L_("nws", 15)}; AAA ${L_("aaa", 16)}.</p>
  </div>
</section>

<section class="block">
  <h2>தயாராக இருங்கள்: வெள்ளத்திற்கு முன், வெள்ளத்தின் போது, வெள்ளத்திற்குப் பின்</h2>
  <p class="lead">தேசியப் பேரிடர் மேலாண்மை ஆணையம், இந்திய வானிலை ஆய்வு மையம், தேசிய நோய்க் கட்டுப்பாட்டு மையம் ஆகியவற்றின் அறிவுரைகளின் அடிப்படையில் ${L_("imddos", 17)} ${L_("ncdc", 18)}.</p>
  <div class="grid3">
    <div class="card step"><div class="n">முன்</div><h3>தயார் செய்யுங்கள்</h3><ul>
      <li>உங்கள் தெரு, வீடு, தினசரி செல்லும் வழி வெள்ளத்தில் மூழ்குமா என்று தெரிந்துகொள்ளுங்கள்.</li>
      <li>அவசரப் பை தயாராக வையுங்கள்: குடிநீர், உலர் உணவு, மருந்துகள், டார்ச், சார்ஜ் செய்த பவர் பேங்க், விசில், அடையாள அட்டை மற்றும் ஆவணங்களின் நகல்களை நீர்புகா பையில்.</li>
      <li>112, 1070, 1077 எண்களைச் சேமித்து வையுங்கள்.</li>
      <li>வடிகால்களில் பிளாஸ்டிக் அல்லது குப்பைகளை வீசாதீர்கள் ${L_("ndma", 19)}.</li>

// ---------------------------------------------------------------- state and helpers
let lang = "en";
try { const saved = localStorage.getItem("tnfw-lang"); lang = saved || ((navigator.language || "").startsWith("ta") ? "ta" : "en"); } catch (e) {}
const t = () => T[lang];
let state = { risk: null, geo: null, thr: null, rec: null, events: [], fct: null, sel: null };

async function j(url) {
  try { const r = await fetch(url, {cache: "no-store"}); if (!r.ok) return null; return await r.json(); }
  catch (e) { return null; }
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dname(n) { return lang === "ta" ? (TA_DIST[n] || n) : n; }
function ename(e) { return lang === "ta" ? (TA_EVENT[e.id] || e.name) : e.name; }
function fmtDay(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString(lang === "ta" ? "ta-IN" : "en-IN", {weekday: "short", day: "numeric", month: "short"}); }
function fmtDate(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString(lang === "ta" ? "ta-IN" : "en-IN", {day: "numeric", month: "short", year: "numeric"}); }
function lvlBadge(l) { return l === null || l === undefined ? `<span class="lvl ln">${t().nodata}</span>` : `<span class="lvl l${l}">${t().levels[l]}</span>`; }
function whyText(w) { const f = t().why[w.k]; return f ? esc(f(w)) : ""; }

// ---------------------------------------------------------------- static text
function applyText() {
  document.documentElement.lang = lang;
  document.body.classList.toggle("ta", lang === "ta");
  document.querySelectorAll("[data-i]").forEach(el => {
    const v = t()[el.dataset.i];

  });
  document.getElementById("langbtn").textContent = t().other_lang;
  document.title = t().title;
  document.getElementById("legend").innerHTML = t().levels.map((L, i) => `<span><i class="sw" style="background:${COLORS[i]}"></i>${L}</span>`).join("") + `<span><i class="sw" style="background:var(--nodata)"></i>${t().nodata}</span>`;
  document.getElementById("how-steps").innerHTML = t().how.map(([n, h, p]) => `<div class="card step"><div class="n">${n}</div><h3>${h}</h3><p>${p}</p></div>`).join("");
  document.getElementById("about-cards").innerHTML = t().about.map(([h, p]) => `<div class="card step"><h3>${h}</h3><p>${p}</p></div>`).join("");

    `<li><span class="yr">${fmtDate(e.start)}</span>: <a href="${esc(e.source)}" target="_blank" rel="noopener">${esc(ename(e))}</a>, ${e.districts.map(n => esc(dname(n))).join(", ")}</li>`).join("");
}

// ---------------------------------------------------------------- map
function drawMap() {
  const svg = document.getElementById("map");
  const feats = state.geo.features;
  let minx = 999, miny = 999, maxx = -999, maxy = -999;
  const each = (g, fn) => { const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates; polys.forEach(p => p.forEach(ring => ring.forEach(fn))); };
  feats.forEach(f => each(f.geometry, ([x, y]) => { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }));
  const k = Math.cos((miny + maxy) / 2 * Math.PI / 180);
  const W = 600, pad = 10, sx = (W - 2 * pad) / ((maxx - minx) * k);
  const H = Math.round((maxy - miny) * sx + 2 * pad);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const P = ([x, y]) => [(pad + (x - minx) * k * sx).toFixed(1), (pad + (maxy - y) * sx).toFixed(1)];
  let html = "";
  feats.forEach(f => {
    const name = f.properties.name;
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    let d = "", cx = 0, cy = 0, n = 0, best = 0;
    polys.forEach(p => { if (p[0].length > best) best = p[0].length; });
    polys.forEach(p => p.forEach(ring => {
      d += "M" + ring.map(c => P(c).join(",")).join("L") + "Z";
      if (ring.length === best) ring.forEach(c => { const q = P(c); cx += +q[0]; cy += +q[1]; n++; });
    }));
    const r = state.risk && state.risk.districts[name];
    const l = r ? r.level : null;
    html += `<path data-n="${esc(name)}" class="${state.sel === name ? "sel" : ""}" d="${d}" fill="${l === null || l === undefined ? "var(--nodata)" : COLORS[l]}"><title>${esc(dname(name))}: ${r && l !== null ? t().levels[l] : t().nodata}</title></path>`;
    f._c = [cx / n, cy / n];
  });
  feats.forEach(f => { const nm = lang === "ta" ? dname(f.properties.name) : (SHORT[f.properties.name] || f.properties.name); html += `<text x="${f._c[0].toFixed(0)}" y="${f._c[1].toFixed(0)}" text-anchor="middle">${esc(nm)}</text>`; });
  svg.innerHTML = html;
  svg.querySelectorAll("path").forEach(p => p.addEventListener("click", () => select(p.dataset.n)));
}

function renderStatus() {
  const el = document.getElementById("status");
  const r = state.risk;
  if (!r) { el.innerHTML = `<span class="chip">${t().waiting_h}</span>`; return; }
  const counts = [0, 0, 0, 0];
  Object.values(r.districts).forEach(d => { if (d.level !== null && d.level !== undefined) counts[d.level]++; });
  const tm = new Date(r.updated);
  let h = r.demo ? `<span class="chip demo">${t().demo}</span>` : "";
  h += `<span class="chip">${t().updated} ${tm.toLocaleString(lang === "ta" ? "ta-IN" : "en-IN", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})} ${t().ist}</span>`;
  [3, 2, 1].forEach(l => { if (counts[l]) h += `<span class="chip"><i class="sw" style="background:${COLORS[l]}"></i>${counts[l]} ${t().levels[l]}</span>`; });
  if (!counts[1] && !counts[2] && !counts[3]) h += `<span class="chip"><i class="sw" style="background:var(--low)"></i>${t().no_above_low}</span>`;
  if (r.sources_ok) { const down = Object.entries(r.sources_ok).filter(([, v]) => !v).map(([k]) => t().sig[{rain: "forecast", gauges: "gauge", reservoirs: "reservoir"}[k] || k] || k); if (down.length) h += `<span class="chip">${t().delayed}: ${down.map(esc).join(", ")}</span>`; }
  el.innerHTML = h;
}

function renderList() {
  const r = state.risk; const p = document.getElementById("panel");
  if (!r) { p.innerHTML = `<h2>${t().waiting_h}</h2><p class="muted">${t().waiting_p}</p>`; return; }
  const rows = Object.entries(r.districts).sort((a, b) => (b[1].level ?? -1) - (a[1].level ?? -1) || dname(a[0]).localeCompare(dname(b[0])));
  const flagged = rows.filter(([, d]) => d.level > 0).length;
  p.innerHTML = `<h2>${t().flagged(flagged)}</h2><p class="muted">${t().click_hint}</p>
    <div class="list">${rows.map(([n, d]) => `<button data-n="${esc(n)}"><span>${esc(dname(n))}</span>${lvlBadge(d.level)}</button>`).join("")}</div>`;
  p.querySelectorAll("button[data-n]").forEach(b => b.addEventListener("click", () => select(b.dataset.n)));
}

function select(name) {
  state.sel = name;
  document.querySelectorAll("#map path").forEach(p => p.classList.toggle("sel", p.dataset.n === name));
  const d = state.risk && state.risk.districts[name]; const p = document.getElementById("panel");
  if (!d) { p.innerHTML = `<button class="back">&larr; ${t().all_districts}</button><h2>${esc(dname(name))}</h2><p class="muted">${t().nodata}</p>`; }
  else {
    const days = Object.entries(d.rain || {});
    const th = (state.thr && (state.thr.rain[name] || state.thr.rain._default)) || null;
    const past = state.events.filter(e => e.districts.includes(name));
    const whys = d.why && d.why.length ? d.why : null;
    const reasons = whys ? `<ul class="reason">${whys.map(w => `<li>${lvlBadge(w.lvl)} ${whyText(w)}</li>`).join("")}</ul>`
                         : `<p class="reason">${d.reasons && d.reasons.length && lang === "en" ? d.reasons.map(esc).join("<br>") : t().nothing}</p>`;
    const S = t().sig;
    p.innerHTML = `<button class="back">&larr; ${t().all_districts}</button>
      <h2>${esc(dname(name))} ${lvlBadge(d.level)}</h2>
      ${reasons}
      ${d.signals ? `<div class="sigs">${["forecast", "satellite", "imd", "gauge", "reservoir"].map(k => `<span class="sig">${S[k]} ${k in d.signals ? lvlBadge(d.signals[k]) : `<span class="lvl ln">–</span>`}</span>`).join("")}</div>` : ""}
      ${days.length ? `<table><thead><tr><th>${t().day}</th><th class="num">${t().rain_day}</th><th class="num">${t().three_day}</th><th>${t().level}</th></tr></thead>
      <tbody>${days.map(([day, v]) => `<tr><td>${fmtDay(day)}</td><td class="num">${v.r1} mm</td><td class="num">${v.r3} mm</td><td>${lvlBadge(v.level)}</td></tr>`).join("")}</tbody></table>` : ""}
      ${d.rivers && d.rivers.length ? `<h3 style="font-size:1rem;margin:16px 0 4px">${t().rivers}</h3><table><tbody>${d.rivers.map(rv => `<tr><td>${esc(rv.name)}</td><td class="num">${rv.peak_7d_m3s ?? "–"} ${t().peak7}</td><td>${lvlBadge(rv.level)}</td></tr>`).join("")}</tbody></table>` : ""}
      ${d.gauge ? `<p class="muted">${esc(t().gauge_line(fmtDay(d.gauge.report_date), d.gauge.avg_mm, d.gauge.max_mm))}</p>` : ""}
      ${d.imd ? `<p class="muted">${esc(t().imd_line(d.imd.last_day_mm, fmtDay(d.imd.date), d.imd.three_day_mm))}</p>` : ""}
      ${d.satellite ? `<p class="muted">${esc(t().sat_line(d.satellite.last_day_mm, d.satellite.three_day_mm))}</p>` : ""}
      ${d.reservoirs && d.reservoirs.length ? `<p class="muted">${esc(t().res_line(d.reservoirs.map(r => r.name + " " + Math.round(r.storage_pct) + "%" + (r.rising ? " (" + t().rising + ")" : "")).join(", ")))}</p>` : ""}
      ${th ? `<p class="muted">${esc(t().thr_line(th.r1.warning, th.r3.warning))}</p>` : ""}
      ${past.length ? `<p class="muted">${esc(t().past_line(past.map(e => ename(e) + " (" + e.start.slice(0, 4) + ")").join(", ")))}</p>` : ""}`;
  }
  p.querySelector(".back").addEventListener("click", () => { state.sel = null; document.querySelectorAll("#map path").forEach(x => x.classList.remove("sel")); renderList(); });
}

// ---------------------------------------------------------------- how / record
function renderLevels() {
  const th = state.thr && state.thr.rain._default;
  document.querySelector("#levels-table thead").innerHTML = `<tr><th>${t().lv_cols[0]}</th><th>${t().lv_cols[1]}</th><th class="num">${t().lv_cols[2]}</th><th class="num">${t().lv_cols[3]}</th></tr>`;

  }).join("");

function renderRecord() {
  const el = document.getElementById("record-body"); const rec = state.rec;
  if (!rec) { el.innerHTML = `<div class="card step"><p>${t().rec_wait}</p></div>`; }
  else {
    const s = rec.summary; const SL = t().siglong;
    el.innerHTML = `<div class="grid4" style="margin-bottom:18px">${t().rec_stats(s).map(([b, l]) => `<div class="card stat"><div class="big">${esc(b)}</div><div class="lab">${esc(l)}</div></div>`).join("")}</div>
      <div class="card tablewrap" style="padding:4px 10px"><table>
        <thead><tr>${t().rec_cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${rec.events.map(e => `<tr><td><a href="${esc(e.source)}" target="_blank" rel="noopener">${esc(ename(e))}</a></td><td>${fmtDate(e.start)}</td><td>${e.set === "test" ? t().test : t().training}</td>
          <td class="hit">${e.hit.map(n => esc(dname(n))).join(", ") || "–"}</td><td class="miss">${e.missed.map(n => esc(dname(n))).join(", ") || "–"}</td><td>${(e.caught_by || []).map(k => esc(SL[k] || k)).join(", ") || "–"}</td></tr>`).join("")}</tbody>
      </table></div>
      ${s.by_signal_test ? `<p class="muted">${esc(t().rec_signal(Object.entries(s.by_signal_test).map(([k, v]) => (SL[k] || k) + " " + v.hits + "/" + v.pairs).join(" · ")))}</p>` : ""}
      <p class="muted">${esc(rec.note || "")}</p>`;
  }
  const fe = document.getElementById("fct-body"); const f = state.fct;
  if (!f) { fe.innerHTML = `<div class="card step"><p>${t().fct_wait}</p></div>`; return; }
  fe.innerHTML = `<div class="grid4" style="margin-bottom:18px">${t().fct_stats(f.summary).map(([b, l]) => `<div class="card stat"><div class="big">${esc(b)}</div><div class="lab">${esc(l)}</div></div>`).join("")}</div>
    <div class="card tablewrap" style="padding:4px 10px"><table>
      <thead><tr>${t().fct_cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${f.events.map(e => `<tr><td>${esc(ename(e))}</td><td>${fmtDate(e.start)}</td><td>${e.districts.map(r => esc(dname(r.district)) + ": " + `<span class="${r.max_lead_days === null ? "miss" : "hit"}">${esc(t().lead_txt(r.max_lead_days))}</span>`).join("<br>")}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="muted">${esc(f.summary.note || "")}</p>`;
}

// ---------------------------------------------------------------- tabs and language
function showTab() {
  const id = (location.hash || "#map").slice(1);
  const tab = ["map", "learn", "how", "record", "about"].includes(id) ? id : "map";
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + tab));
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  window.scrollTo(0, 0);
}
function renderAll() {
  applyText();
  if (state.geo) drawMap();
  renderStatus();
  if (state.sel) select(state.sel); else renderList();
  renderLevels(); renderRecord();
}
document.getElementById("langbtn").addEventListener("click", () => {
  lang = lang === "en" ? "ta" : "en";
  try { localStorage.setItem("tnfw-lang", lang); } catch (e) {}
  renderAll();
});
window.addEventListener("hashchange", showTab);

(async function init() {
  showTab(); applyText();
  const [geo, risk, thr, rec, events, fct] = await Promise.all([
    j("data/districts.json"), j("data/risk.json"), j("data/thresholds.json"), j("data/backtest.json"), j("data/flood_events.json"), j("data/forecast_test.json")]);
  Object.assign(state, {geo, risk, thr, rec, events: events || [], fct});
  renderAll();
})();
}
</script>
</body>
